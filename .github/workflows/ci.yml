name: CI

on:
  push:
    branches:
      - main
      - project3-stage-a
  pull_request:
    branches:
      - main

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "black[jupyter]" ruff mypy

      - name: Run Ruff
        run: ruff check notebooks/fuel_reconciliation.ipynb

      - name: Run Black
        run: black --check notebooks/fuel_reconciliation.ipynb

      - name: Run mypy
        run: mypy src tests